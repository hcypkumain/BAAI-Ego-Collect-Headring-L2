# camd 相机守护进程配置（key=value，# 注释）
socket_path=/run/camd.sock
width=1920
height=1200
fps=30
bitrate_mbps=10       # 常驻编码器码率（Mbps）
gop=30                # 常驻编码器关键帧间隔（帧数）
iqpath=/etc/iqfiles/
camgroup=0            # 1=四路 camgroup 3A 同步, 0=每路独立（外触发模式下 camgroup 不出帧，须用 0）
bufs=6
# 每路相机：名字 + 视频节点或 sensor 名（顺序即 cam 索引）。
# 推荐用 sensor 名（设备树 mXX_b_xxx 前缀，稳定）；/dev/videoN 编号随加载顺序可能变化。
# 注意：sensor 名由设备树命名，不同 DTB 版本可能不同（如 m00/m02/m03/m04 vs m00~m03）。
# 装机时 gen_camd_conf.sh（由 install_release.sh / install_autostart.sh 调用）会按
# HARDWARE_MODEL 选角色↔I2C 控制器 MMIO 映射表（表 A: 01-155/01-171 用下列映射；
# 表 B: 0150-152/0151-152 前后对调），再从本机设备树读实际 sensor 名自动重写
# 以下 cam= 行，此处仅为模板/回退值：
#   left=feac0000  right=feab0000  bright=feca0000  bleft=fea90000
# 参考映射（旧 DTB，与 config/v4l2_isp/v4l2_isp_ego4_01_171.yaml 一致）：
#   left=video71=m03(4-0030)  right=video62=m04(3-0030)
#   bright=video44=m00(8-0030)  bleft=video53=m02(1-0030)
cam=left,m00_b_sc233hgs
cam=right,m01_b_sc233hgs
cam=bright,m02_b_sc233hgs
cam=bleft,m03_b_sc233hgs
