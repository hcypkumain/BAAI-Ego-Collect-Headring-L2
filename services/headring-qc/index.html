<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>头环质检中心</title>
<style>
:root{--bg:#10141c;--panel:#191f2a;--line:#2c3546;--text:#e5ebf5;--muted:#9ba9bd;--mint:#70e2b6;--blue:#85b9ff;--amber:#f4c376;--red:#ff9198}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}header{padding:28px 32px 22px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}h1{font-size:25px;margin:0 0 4px;letter-spacing:.03em}.eyebrow{font-size:11px;letter-spacing:.18em;color:var(--mint);font-weight:700}p{margin:5px 0;color:var(--muted)}main{max-width:1800px;margin:auto;padding:24px 32px}.connection{color:var(--mint);display:flex;align-items:center;gap:9px}.dot{width:8px;height:8px;background:currentColor;border-radius:50%;box-shadow:0 0 14px #70e2b640}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-bottom:22px}.card{padding:18px 20px;background:var(--panel);border:1px solid var(--line);border-radius:12px}.card .label{color:var(--muted);font-size:12px}.value{font-size:29px;font-weight:650;margin-top:4px}.small{font-size:12px;color:var(--muted)}.green{color:var(--mint)}.amber{color:var(--amber)}.red{color:var(--red)}.blue{color:var(--blue)}.layout{display:grid;grid-template-columns:265px minmax(0,1fr);gap:20px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}.panelhead{padding:17px 20px;border-bottom:1px solid var(--line);font-weight:600;display:flex;justify-content:space-between;align-items:center}.devices{padding:8px}.device{padding:13px 12px;border-radius:8px;cursor:pointer;border:1px solid transparent}.device:hover,.device.selected{background:#222c3a;border-color:#40516a}.device b{font-size:15px}.device .row{display:flex;justify-content:space-between;align-items:center}.sub{font-size:12px;color:var(--muted);margin-top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tag{font-size:11px;border:1px solid currentColor;border-radius:5px;padding:1px 6px;white-space:nowrap}.notice{font-size:12px;color:var(--muted);padding:17px 18px;border-top:1px solid var(--line)}.notice b{color:var(--text)}.toolbar{padding:14px 18px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line)}button{font:inherit;border:1px solid var(--line);background:transparent;color:var(--muted);padding:7px 11px;border-radius:7px;cursor:pointer}button:hover,button.active{background:#2b3b50;color:var(--text);border-color:#516b8d}input{margin-left:auto;min-width:220px;background:#111722;border:1px solid var(--line);padding:9px 12px;border-radius:7px;color:var(--text);font:inherit}input:focus{outline:2px solid #85b9ff70}table{width:100%;border-collapse:collapse;text-align:left}th{color:var(--muted);font-size:11px;letter-spacing:.06em;font-weight:500;background:#171e29}td,th{padding:12px 16px;border-bottom:1px solid #2c35467a}td{font-size:12px}tr[data-id]{cursor:pointer}tr[data-id]:hover{background:#222c3a}.name{font-size:13px;font-weight:500;max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.session{color:var(--muted);font-family:ui-monospace,monospace;font-size:10px;margin-top:3px}.bar{height:4px;background:#303b4e;border-radius:10px;min-width:95px;margin-top:6px;overflow:hidden}.bar span{display:block;height:100%;background:var(--blue);border-radius:10px}.empty{padding:65px 25px;text-align:center;color:var(--muted)}.events{margin-top:22px}.event{display:grid;grid-template-columns:70px 75px 1fr;gap:15px;padding:9px 18px;font-size:12px;border-bottom:1px solid #2c354655}.event time{color:var(--muted)}.tablewrap{overflow:auto;max-height:560px}.tablefoot{padding:10px 18px;font-size:11px;color:var(--muted)}dialog{background:var(--panel);color:var(--text);border:1px solid #50617a;border-radius:14px;width:min(760px,94vw);max-height:85vh;padding:0}dialog::backdrop{background:#050912bb}.detail{padding:20px;overflow:auto;max-height:65vh}.finding{border-left:3px solid var(--amber);padding:10px 13px;background:#101722;margin:10px 0;border-radius:5px}.finding.error{border-color:var(--red)}.finding p{font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere}.pill{display:inline-block;padding:3px 8px;border-radius:6px;background:#273549;font-size:11px}footer{padding:18px 0;font-size:11px;color:var(--muted)}.topmeta{text-align:right}.offline{color:var(--muted)}@media(max-width:1100px){.stats{grid-template-columns:repeat(3,1fr)}.layout{grid-template-columns:220px minmax(0,1fr)}main{padding:20px}}@media(max-width:760px){header{padding:20px;gap:14px;align-items:flex-start}.topmeta{font-size:11px}.layout{display:block}.sidebar{margin-bottom:18px}.devices{display:grid;grid-template-columns:repeat(2,1fr)}.notice{padding:12px}.stats{gap:9px}.card{padding:12px}.value{font-size:23px}.toolbar input{width:100%;margin:5px 0}.event{grid-template-columns:60px 65px 1fr;gap:8px}.hide-sm{display:none}main{padding:14px}}
</style></head><body>
<header><div><div class="eyebrow">HEADRING · OPERATIONS</div><h1>头环质检中心</h1><p>集中质检 · 安全归档 · 原列表补采</p></div><div class="topmeta"><div class="connection"><span class="dot"></span><span id="connection">正在连接服务器</span></div><p id="batch">加载采集批次…</p><div class="small" id="updated"></div></div></header>
<main><section class="stats" id="stats"></section><div class="layout"><aside class="panel sidebar"><div class="panelhead">头环设备<button id="allDevices">全部</button></div><div class="devices" id="devices"></div><div class="notice"><b>采集任务优先</b><br>准备、录制与收尾期间，暂停该台数据读取和清理。<br><br><b>不合格回原列表</b><br>可选择原列表及任务编号补采，服务器暂留隔离副本。<br><br><b>校验后清理 Pi</b><br>完整复制、逐文件校验、结果回传确认后，才清理对应原始数据。</div></aside>
<section class="panel"><div class="panelhead"><span>处理队列</span><span class="small" id="queueSize"></span></div><div class="toolbar"><button data-filter="all" class="active">全部</button><button data-filter="active">进行中</button><button data-filter="waiting">等待处理</button><button data-filter="failed">不合格 / 补采</button><button data-filter="done">已安全归档</button><input id="search" placeholder="搜索头环、任务、采集编号" aria-label="搜索队列"></div><div class="tablewrap"><table><thead><tr><th>头环 / 任务</th><th>进度</th><th>QC 结果</th><th class="hide-sm">数据量</th><th>原始数据</th></tr></thead><tbody id="rows"></tbody></table><div class="empty" id="empty" hidden>没有符合条件的任务</div></div><div class="tablefoot" id="tablefoot"></div></section></div>
<section class="panel events"><div class="panelhead">最近动态 <span class="small">自动更新</span></div><div id="events"></div></section><footer id="storage"></footer></main>
<dialog id="modal"><div class="panelhead"><span id="detailTitle">质检详情</span><button id="closeModal">关闭</button></div><div class="detail" id="detail"></div></dialog>
<script>
const $=s=>document.querySelector(s);let snapshot=null,filter='all',deviceFilter=null,selected=null;
const stage={blocked:'复检运行异常，等待检查',raw_ready:'已完整传入，等待 QC',queued:'等待传输',waiting:'等待 / 暂停',copying:'传输原始数据',verifying:'校验完整性',waiting_qc:'等待服务器 QC',qc:'执行完整 QC',applying:'回传结果',final_sync:'同步最终数据',archiving:'服务器落盘',cleaning:'校验并清理 Pi',verified_hold:'已核验，原件保留',done:'处理完成'};
const active=new Set(['copying','verifying','waiting_qc','qc','applying','final_sync','archiving','cleaning']);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const bytes=n=>{n=Number(n||0);return n>=1e9?(n/1e9).toFixed(2)+' GB':(n/1e6).toFixed(1)+' MB'};
const clock=t=>new Date(t*1000).toLocaleTimeString('zh-CN',{hour12:false});
function label(j){return j.level==='ERROR'?'<span class="tag red">不合格</span>':j.level==='WARN'?'<span class="tag amber">合格（有提醒）</span>':j.level==='INFO'?'<span class="tag green">合格</span>':'<span class="small">待完整质检</span>'}
function stageLabel(j){return j.mode==='local_recheck'?({queued:'等待本机复检',copying:'准备复检副本',qc:'本机完整复检',verifying:'核验原件和报告',done:'本机复检完成',blocked:'复检运行异常'}[j.state]||esc(j.state)):(stage[j.state]||esc(j.state))}
function render(){if(!snapshot)return;let s=snapshot,jobs=s.jobs,networkJobs=jobs.filter(j=>j.mode!=='local_recheck'),done=networkJobs.filter(j=>j.state==='done'),bad=jobs.filter(j=>j.level==='ERROR'),busy=jobs.filter(j=>active.has(j.state));
let values=[['原始已传入',networkJobs.filter(j=>j.ingested).length+' / '+networkJobs.length,'段'],['接收 / 回传',s.network?.ready?Number(s.network.rx_MB_s).toFixed(1)+' / '+Number(s.network.tx_MB_s).toFixed(1):'—','MB/s'],['累计标准化完成',s.standardized?.ready?s.standardized.total:'—','段'],['队列 QC 不合格',bad.length,'段'],['Pi 已安全清理',done.length,'段'],['本机可用',(s.disk.free/1e9).toFixed(0),'GB']];
$('#stats').innerHTML=values.map((v,i)=>`<div class="card"><div class="label">${v[0]}</div><div class="value ${i===3?'amber':i===4?'green':''}">${v[1]} <span class="small">${v[2]}</span></div></div>`).join('');
$('#batch').textContent=(s.continuous_ingestion?'持续采集':s.day+' 采集批次')+' · '+(jobs.length&&jobs.every(j=>j.state==='done')?'当前队列处理完成':jobs.every(j=>j.ingested)?'原始数据全部传入，处理结果与归档中':'传输与质检中');$('#updated').textContent='最后更新 '+clock(s.now);$('#connection').textContent='服务器在线';$('.connection').style.color='var(--mint)';
$('#devices').innerHTML=s.devices.map(d=>{let all=networkJobs.filter(j=>j.device===d.id),n=all.filter(j=>j.state==='done').length,recheck=s.historical_rechecks?.find(r=>r.device===d.id),online=d.status!=='offline',cur=d.details?.task_list?.name||'暂无进行中的列表';return `<div class="device ${deviceFilter===d.id?'selected':''}" data-device="${esc(d.id)}"><div class="row"><b>${Number(d.id.slice(3))} 号头环</b><span class="${d.status==='busy'?'amber':online?'green':'offline'}">${d.status==='busy'?'采集中，后台暂停':online?'在线':s.historical_devices?.includes(d.id)?'历史设备':'暂不可达'}</span></div><div class="sub">${esc(cur)}</div><div class="sub">累计标准化完成：${s.standardized?.ready?(s.standardized.by_device[d.id]||0):'—'} 段</div><div class="sub">接收队列：${n} / ${all.length} 段完成</div>${recheck?`<div class="sub blue">本机历史复检：${recheck.completed} / ${recheck.total} 段完成</div>`:''}</div>`}).join('');
let text=$('#search').value.trim().toLowerCase();let visible=jobs.filter(j=>(!deviceFilter||j.device===deviceFilter)&&(!text||[j.device,j.session,j.details.reference_name,j.details.task_name].join(' ').toLowerCase().includes(text))&&(filter==='all'||filter==='active'&&active.has(j.state)||filter==='waiting'&&['queued','waiting','raw_ready','verified_hold'].includes(j.state)||filter==='failed'&&j.level==='ERROR'||filter==='done'&&j.state==='done'));
$('#rows').innerHTML=visible.slice(0,350).map(j=>`<tr data-id="${j.id}"><td><div class="name">${Number(j.device.slice(3))} 号 · ${esc(j.details.reference_name||j.details.task_name||'已保存的采集任务')}</div><div class="session">${esc(j.session)}</div></td><td><span class="${active.has(j.state)?'blue':j.state==='done'?'green':'amber'}">${stageLabel(j)}</span>${active.has(j.state)?`<div class="bar"><span style="width:${Math.max(4,Math.min(100,j.progress||0))}%"></span></div>`:''}</td><td>${label(j)}</td><td class="hide-sm small">${bytes(j.bytes)}</td><td><span class="${j.state==='done'?'green':'small'}">${j.mode==='local_recheck'?'本机原件保留':j.state==='done'?'已确认清理':'仍保留'}</span></td></tr>`).join('');
$('#empty').textContent=deviceFilter&&s.standardized?.ready&&(s.standardized.by_device[deviceFilter]||0)>0?'已发布 '+s.standardized.by_device[deviceFilter]+' 个标准包；当前没有符合筛选条件的接收任务。':'没有符合条件的任务';$('#empty').hidden=!!visible.length;$('#queueSize').textContent=jobs.length+' 段 · '+bytes(jobs.reduce((a,j)=>a+j.bytes,0))+' · '+(s.transfer_parallelism||2)+' 路传输 · '+(s.transfer_kib_s===0?'不限速':(s.transfer_kib_s/1024).toFixed(0)+' MB/s/路')+' · '+(s.qc_video_backend==='nvdec'?'GPU 硬解 QC':'CPU QC');$('#tablefoot').textContent='显示 '+Math.min(350,visible.length)+' / '+visible.length+' 条 · 点击任务查看结果和失败原因';
$('#events').innerHTML=s.events.slice(0,18).map(e=>`<div class="event"><time>${clock(e.at)}</time><span>${Number(e.device.slice(3))} 号</span><div>${esc(e.message)}</div></div>`).join('')||'<div class="notice">队列正在建立，传输与 QC 动态会显示在这里。</div>';
$('#storage').textContent='本机保存目录：'+s.data_root+'  · 不合格数据位于 quarantine 隔离区。';if(selected&&$('#modal').open)detail(selected,false)}
function detail(id,open=true){let j=snapshot.jobs.find(j=>String(j.id)===String(id));if(!j)return;selected=id;$('#detailTitle').textContent=Number(j.device.slice(3))+' 号 · '+j.session;let q=j.details.qc_summary||{},f=q.findings||[];
$('#detail').innerHTML=`${label(j)}<p>状态：${stageLabel(j)}　数据量：${bytes(j.bytes)}</p><p>参考任务：${esc(j.details.reference_name||j.details.reference||'—')}</p>${j.archive_path?`<p>保存位置：${esc(j.archive_path)}</p>`:''}${j.mode==='local_recheck'?'<p>本机历史复检：原始数据、标定资料和已有标准包保留。</p>':''}${j.level==='ERROR'?'<p class="amber">该段未通过完整质检。可回原列表选择任务编号补采，以该任务最新的采集结果为准。服务器保留隔离副本。</p>':''}${j.error?`<div class="finding"><b>当前等待原因</b><p>${esc(j.error)}</p></div>`:''}${f.length?f.map(x=>`<div class="finding ${x.level==='ERROR'?'error':''}"><b>${esc(x.modality)} · ${esc(x.check||x.level)}</b><p>${esc(x.message)}</p>${x.detail?`<p>${esc(typeof x.detail==='string'?x.detail:JSON.stringify(x.detail,null,2))}</p>`:''}</div>`).join(''):'<p>完整 QC 结果生成后，具体原因、侧别和检查项会显示在这里。</p>'}`;
if(open)$('#modal').showModal()}
document.addEventListener('click',e=>{let f=e.target.closest('[data-filter]');if(f){filter=f.dataset.filter;document.querySelectorAll('[data-filter]').forEach(b=>b.classList.toggle('active',b===f));render()}let d=e.target.closest('[data-device]');if(d){deviceFilter=d.dataset.device;render()}let r=e.target.closest('tr[data-id]');if(r)detail(r.dataset.id)});
$('#allDevices').onclick=()=>{deviceFilter=null;render()};$('#search').oninput=render;$('#closeModal').onclick=()=>$('#modal').close();
async function refresh(){try{let r=await fetch('/api/status',{cache:'no-store'});if(!r.ok)throw Error(r.status);snapshot=await r.json();render()}catch(e){$('#connection').textContent='连接中断，正在重试';$('.connection').style.color='var(--amber)'}finally{setTimeout(refresh,2500)}}refresh();
</script></body></html>
