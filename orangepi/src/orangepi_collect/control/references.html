;gap:12px;align-items:center}.thumb{width:92px;height:60px;object-fit:contain;background:#edf2f6;border-radius:6px;flex-shrink:0}.item .title{font-weight:600;overflow-wrap:anywhere}.item .meta{font-size:12px;color:#678093}.actions{display:flex;gap:6px;flex-wrap:wrap}.actions button{font-size:13px;padding:7px 10px}progress{accent-color:#087c88;width:100%;height:12px}#viewer{position:fixed;inset:0;background:#061b2be8;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;gap:14px}#viewer img{max-width:96vw;max-height:82vh;object-fit:contain;background:white}#viewer button{background:#fff}footer{font-size:13px;color:#6c8597;padding:4px 2px}.muted{color:#718796}.file{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}.section-note{margin:10px 0;color:#637e90;font-size:14px}

<header><h1>参考图与任务列表</h1><p>手机或电脑上传、删除图片，再选择列表；每段随机抽取一张未完成的图。</p></header>
<main><div id="notice" role="status" aria-live="polite" hidden></div>
<section id="login" class="card"><h2>连接图库</h2><p class="section-note">在手机采集页的“参考图库”入口查看管理码，使用该入口或扫码打开时会自动连接。</p><form id="loginForm" class="row"><input id="code" class="code" placeholder="12位管理码" maxlength="20" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="图库管理码"><button class="primary" type="submit">连接</button></form></section>
<section id="library" hidden>
<div class="card"><div class="row end"><h2>任务列表</h2><button id="trash" type="button" data-lock>回收站</button></div><label class="small" for="lists">选择要管理的列表</label><div class="row"><select id="lists" data-lock></select><button id="refresh" type="button" data-lock>刷新</button></div>
<div class="toolbar"><label class="button primary" id="bundleLabel" for="bundle">上传任务包(.zip)</label><input class="file" id="bundle" type="file" accept=".zip,application/zip" multiple data-lock><button id="create" type="button" data-lock>新建列表</button><button id="clone" type="button" data-lock>复制当前列表</button><label class="button" id="uploadLabel" for="files">上传图片</label><input class="file" id="files" type="file" accept="image/png,image/jpeg,image/webp" multiple data-lock><button id="rename" type="button" data-lock>改名</button><button id="deleteList" class="danger" type="button" data-lock>删除列表</button></div>
<p class="small">任务包：选择一个或多个 .zip，每个包按文件名建一个列表，导入其中的图片，并保存包内的 config.yaml / placements.csv。</p>
<p id="listNote" class="section-note"></p><div id="uploadProgress" hidden><progress id="progress" max="1" value="0"></progress><div id="progressText" class="small"></div></div></div>
<div class="card"><div class="row end"><h2 id="heading">参考图</h2><span class="pill" id="counts"></span></div><div id="items" class="list"></div><div class="toolbar"><button id="more" type="button" data-lock hidden>加载更多</button></div></div>
<footer>删除后可在回收站恢复。已采集的数据保留。此页面只管理参考图，采集操作请在 Pi 采集控制页面完成。</footer></section>
<div id="viewer" hidden role="dialog" aria-modal="true" aria-label="参考图预览"><img id="large" alt="参考图预览"><button id="closeViewer" type="button">关闭预览</button></div>
<div id="editor" hidden role="dialog" aria-modal="true" aria-labelledby="editorTitle"><form id="editorForm" novalidate><h2 id="editorTitle"></h2><p id="editorMessage"></p><div id="editorField"><label class="small" for="editorInput">列表名称</label><input id="editorInput" maxlength="128" autocomplete="off" aria-label="列表名称"></div><div id="editorError" aria-live="polite"></div><div class="row"><button id="editorCancel" type="button">取消</button><button id="editorAccept" class="primary" type="submit">确认</button></div></form></div>
</main>
<script src="/reference-bundles.js?v=20261102.1"></script><script>
'use strict';
const $=id=>document.getElementById(id);
const state={code:'',revision:0,lists:[],list:null,selected:'all',trash:false,offset:0,next:null,busy:false,urls:[],thumbQueue:[],thumbWorkers:0,viewUrl:null,viewGeneration:0};
let editorPending=null;
function finishEditor(value){const pending=editorPending;if(!pending)return;editorPending=null;$('editor').hidden=true;$('editorInput').value='';if(pending.previous&&pending.previous.isConnected)pending.previous.focus();pending.resolve(value);}
function ask(title,initial=null,message=''){if(editorPending)finishEditor(null);return new Promise(resolve=>{editorPending={resolve,text:initial!==null,previous:document.activeElement};$('editorTitle').textContent=title;$('editorMessage').textContent=message;$('editorField').hidden=initial===null;$('editorInput').value=initial===null?'':initial;$('editorError').textContent='';$('editorAccept').textContent=initial===null?'确认':'保存';$('editor').hidden=false;requestAnimationFrame(()=>{if(initial===null)$('editorCancel').focus();else{$('editorInput').focus();$('editorInput').select();}});});}
function askText(title,initial=''){return ask(title,initial);}
async function askConfirm(message){return (await ask('确认操作',null,message))===true;}
$('editorCancel').onclick=()=>finishEditor(null);$('editorForm').onsubmit=event=>{event.preventDefault();if(!editorPending)return;if(editorPending.text){const value=$('editorInput').value.trim();if(!value){$('editorError').textContent='请输入列表名称。';$('editorInput').focus();return;}finishEditor(value);}else finishEditor(true);};
$('editor').addEventListener('keydown',event=>{if(event.key==='Escape'){event.preventDefault();event.stopPropagation();finishEditor(null);}if(event.key==='Tab'){const fields=[$('editorInput'),$('editorCancel'),$('editorAccept')].filter(x=>x.offsetParent!==null);const first=fields[0],last=fields[fields.length-1];if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}}});
function notice(message,error=false){$('notice').textContent=message;$('notice').className=error?'error':'';$('notice').hidden=!message;}
function busy(value){state.busy=value;document.querySelectorAll('[data-lock]').forEach(x=>x.disabled=value);controls();}
function controls(){const item=state.list;const edit=!!item&&!item.readonly&&!item.deleted&&!state.trash&&!state.busy;$('rename').disabled=!edit;$('deleteList').disabled=!item||item.id==='all'||state.busy;$('deleteList').textContent=item&&item.deleted?'恢复列表':'删除列表';$('clone').disabled=!item||item.deleted||state.busy;$('files').disabled=state.busy||state.trash;$('uploadLabel').classList.toggle('disabled',$('files').disabled);
 $('bundle').disabled=state.busy||state.trash;$('bundleLabel').classList.toggle('disabled',$('bundle').disabled);}
function headers(extra={}){return Object.assign({'X-Reference-Key':state.code},state.collection_context?{'X-Collection-Context':state.collection_context}:{},extra);}
async function request(path,body){let response;try{response=await fetch(path,{method:body?'POST':'GET',headers:headers(body?{'Content-Type':'application/json'}:{}),body:body?JSON.stringify(body):undefined,cache:'no-store',credentials:'omit'});}catch(error){throw new Error('网络连接中断。请恢复连接后点“刷新”确认结果；不会自动重复提交。');}let value;try{value=await response.json();}catch(error){throw new Error('设备响应不完整，请点“刷新”确认结果。');}if(!response.ok){if(response.status===401){$('login').hidden=false;}throw new Error(value.message||'操作失败，请刷新后再试');}if(value.collection_context)state.collection_context=value.collection_context;return value;}
function query(values){return new URLSearchParams(values).toString();}
async function loadCatalog(wanted=state.selected){let rows=[],offset=0,revision=null;do{const value=await request('/api/reference-library?'+query({offset,limit:50,include_deleted:state.trash?1:0}));if(revision!==null&&revision!==value.revision)throw new Error('图库已更新，请再点一次刷新。');revision=value.revision;rows.push(...value.lists);offset=value.next_offset;}while(offset!==null);state.revision=revision;state.lists=rows;const select=$('lists');select.replaceChildren();for(const row of rows){const option=document.createElement('option');option.value=row.id;option.textContent=(row.deleted?'回收站 · ':'')+row.name+'（'+row.remaining+' / '+row.count+' 待采集）';select.append(option);}state.selected=rows.some(x=>x.id===wanted)?wanted:'all';select.value=state.selected;$('login').hidden=true;$('library').hidden=false;await loadItems(true);}
function releaseThumbnails(){state.viewGeneration++;for(const url of state.urls)URL.revokeObjectURL(url);state.urls=[];state.thumbQueue=[];}
function queueThumbnail(image,row,generation){state.thumbQueue.push({image,row,generation});pumpThumbnails();}
function pumpThumbnails(){while(state.thumbWorkers<2&&state.thumbQueue.length){const job=state.thumbQueue.shift();state.thumbWorkers++;fetch('/api/reference-thumbnail?'+query({id:job.row.id,include_deleted:job.row.deleted?1:0}),{headers:headers(),cache:'no-store',credentials:'omit'}).then(r=>{if(!r.ok)throw new Error('thumbnail');return r.blob();}).then(blob=>{if(job.generation!==state.viewGeneration)return;const url=URL.createObjectURL(blob);state.urls.push(url);job.image.src=url;}).catch(()=>{}).finally(()=>{state.thumbWorkers--;pumpThumbnails();});}}
async function preview(row){try{const response=await fetch('/api/reference-thumbnail?'+query({id:row.id,include_deleted:row.deleted?1:0}),{headers:headers(),cache:'no-store',credentials:'omit'});if(!response.ok)throw new Error('预览暂时不可用，请稍后再试。');const blob=await response.blob();if(state.viewUrl)URL.revokeObjectURL(state.viewUrl);state.viewUrl=URL.createObjectURL(blob);$('large').src=state.viewUrl;$('viewer').hidden=false;}catch(error){notice(error.message,true);}}
function button(text,action,classes=''){const value=document.createElement('button');value.type='button';value.textContent=text;value.className=classes;value.dataset.lock='';value.disabled=state.busy;value.onclick=action;return value;}
function renderItem(row,index){const item=document.createElement('article');item.className='item';const thumb=document.createElement('img');thumb.className='thumb';thumb.alt='';thumb.loading='lazy';const body=document.createElement('div');body.className='grow';const name=document.createElement('div');name.className='title';name.textContent=(index+1)+'. '+row.name;const meta=document.createElement('div');meta.className='meta';meta.textContent=row.deleted?'已在回收站':row.completed?'已完成采集':row.origin==='upload'?'上传图片 · 待采集':'原有参考图 · 待采集';const actions=document.createElement('div');actions.className='actions';actions.append(button('预览',()=>preview(row)));if(row.deleted){actions.append(button('恢复图片',()=>mutate({action:'restore_image',id:row.id})));}else{if(!state.list.readonly&&!state.list.deleted&&!state.trash){actions.append(button('上移',()=>mutate({action:'move_image',id:state.selected,image_id:row.id,delta:-1})),button('下移',()=>mutate({action:'move_image',id:state.selected,image_id:row.id,delta:1})),button('移出列表',async()=>{if(await askConfirm('只从当前列表移除这张图？图片仍保留在图库中。'))mutate({action:'remove_image',id:state.selected,image_id:row.id});}));}if(!state.trash)actions.append(button('删除图片',async()=>{if(await askConfirm('将“'+row.name+'”移入回收站？它会从所有列表隐藏，已采集数据保留。'))mutate({action:'delete_image',id:row.id});},'danger'));}body.append(name,meta,actions);item.append(thumb,body);$('items').append(item);queueThumbnail(thumb,row,state.viewGeneration);}
async function loadItems(reset){if(reset){releaseThumbnails();state.offset=0;$('items').replaceChildren();}const value=await request('/api/reference-list?'+query({id:state.selected,offset:state.offset,limit:50,include_deleted:state.trash?1:0,deleted_only:state.trash&&state.selected==='all'?1:0}));if(!reset&&value.revision!==state.revision)throw new Error('图库已更新，请刷新列表。');state.revision=value.revision;state.list=value.list;state.next=value.next_offset;const start=state.offset;value.items.forEach((row,i)=>renderItem(row,start+i));state.offset=state.next;state.list.items=undefined;$('heading').textContent=state.trash?'回收站':value.list.name;$('counts').textContent=state.trash?value.total+' 张':value.list.remaining+' / '+value.list.count+' 待采集';$('more').hidden=state.next===null;$('trash').textContent=state.trash?'返回图库':'回收站';const scene=value.list.scene;
 $('listNote').textContent=(state.trash?'恢复列表或图片后，可重新在 Pi 采集控制页面 选择使用。':value.list.readonly?'原有列表按原顺序展示。可复制为自定义列表后调整，或直接上传并创建新列表。':'在采集控制页“任务列表”中选择此列表；每段随机抽取未完成的图，重采保持同一张。')+(scene&&scene.files&&scene.files.length?'\n任务包附带场景文件：'+scene.files.join('、')+(scene.notes?'\n'+scene.notes:''):'');if(reset&&value.items.length===0){const empty=document.createElement('p');empty.className='muted';empty.textContent=state.trash?'回收站里没有图片。':'这个列表还没有图片，点击“上传图片”开始添加。';$('items').append(empty);}controls();}
async function mutate(body,wanted){if(state.busy)return;busy(true);notice('正在保存…');try{const value=await request('/api/reference-library',Object.assign({revision:state.revision},body));state.revision=value.revision;await loadCatalog(wanted||state.selected);notice('已保存。可在采集控制页选择这个列表，随机抽图采集。');}catch(error){notice(error.message,true);}finally{busy(false);}}
$('loginForm').onsubmit=async event=>{event.preventDefault();state.code=$('code').value.trim().toUpperCase().replace(/\s+/g,'');if(!/^[A-HJ-NP-Z2-9]{12}$/.test(state.code)){notice('请输入 Pi 采集控制页面 显示的12位图库管理码。',true);return;}sessionStorage.setItem('pi-collect-reference-key',state.code);busy(true);try{await loadCatalog();notice('已连接图库。');}catch(error){notice(error.message,true);}finally{busy(false);}};
$('lists').onchange=async()=>{state.selected=$('lists').value;busy(true);try{await loadItems(true);notice('');}catch(error){notice(error.message,true);}finally{busy(false);}};
$('refresh').onclick=async()=>{busy(true);try{await loadCatalog();notice('已刷新。');}catch(error){notice(error.message,true);}finally{busy(false);}};
$('trash').onclick=async()=>{state.trash=!state.trash;busy(true);try{await loadCatalog('all');notice('');}catch(error){notice(error.message,true);}finally{busy(false);}};
$('create').onclick=async()=>{const name=await askText('新建任务列表','');if(name)create(name);};
async function create(name){if(state.busy)return;busy(true);try{const value=await request('/api/reference-library',{action:'create_list',name,revision:state.revision});await loadCatalog(value.id);notice('列表已创建，可以上传图片。');}catch(error){notice(error.message,true);}finally{busy(false);}}
$('clone').onclick=async()=>{if(!state.list)return;const name=await askText('复制当前列表',state.list.name+' · 自定义');if(!name)return;busy(true);try{const value=await request('/api/reference-library',{action:'clone_list',source_id:state.selected,name,revision:state.revision});await loadCatalog(value.id);notice('已复制，可调整图片顺序。');}catch(error){notice(error.message,true);}finally{busy(false);}};
$('rename').onclick=async()=>{if(!state.list||state.list.readonly)return;const name=await askText('修改列表名称',state.list.name);if(name)mutate({action:'rename_list',id:state.selected,name});};
$('deleteList').onclick=async()=>{if(!state.list||state.selected==='all')return;if(state.list.deleted){mutate({action:'restore_list',id:state.selected});}else if(await askConfirm('将“'+state.list.name+'”移入回收站？列表中的图片仍保留，已采集数据不受影响。'+(state.list.readonly?'\n\n这是系统列表，需要先“复制当前列表”保留其参考图，否则设备会拒绝移入回收站。':'')))mutate({action:'delete_list',id:state.selected},'all');};
$('more').onclick=async()=>{if(state.next===null)return;busy(true);try{await loadItems(false);}catch(error){notice(error.message,true);}finally{busy(false);}};
$('files').onchange=async()=>{const files=Array.from($('files').files||[]);$('files').value='';if(!files.length)return;if(files.length>20){notice('每次最多选择20张图片，可分批上传。',true);return;}if(files.some(file=>file.size>12*1024*1024)){notice('每张图片最多12MiB，请减少图片大小。',true);return;}let target=state.selected;busy(true);$('uploadProgress').hidden=false;$('progress').max=files.length;$('progress').value=0;try{if(!state.list||state.list.readonly||state.list.deleted){const name=await askText('为上传图片新建列表','新上传图片');if(!name)return;const value=await request('/api/reference-library',{action:'create_list',name,revision:state.revision});target=value.id;state.revision=value.revision;}for(let i=0;i<files.length;i++){const file=files[i];$('progressText').textContent='正在上传 '+(i+1)+' / '+files.length+'：'+file.name;notice('正在上传，请保持此页面打开。');let response;try{response=await fetch('/api/reference-upload?'+query({list_id:target,revision:state.revision,name:file.name}),{method:'POST',headers:headers({'Content-Type':'application/octet-stream'}),body:file,credentials:'omit'});}catch(error){throw new Error('网络中断，已成功的图片保留。请刷新图库确认后再上传剩余图片。');}const value=await response.json();if(!response.ok)throw new Error(value.message||'上传失败，请刷新确认。');state.revision=value.revision;$('progress').value=i+1;}await loadCatalog(target);notice(files.length+' 张图片已处理。请在采集控制页选择此列表，之后每段随机抽图。');}catch(error){notice(error.message,true);}finally{$('uploadProgress').hidden=true;busy(false);}};
/* --- Task bundle (.zip) import -------------------------------------------
   Reads the zip central directory in the browser and posts each member through
   the existing single-image/scene routes, so the device keeps its per-image
   validation, revision checks and size limits. Only stored (0) and deflated
   (8) entries exist in these bundles; anything else is reported, not guessed. */
async function importBundle(file,prepared){
 const plan=prepared||await ReferenceBundles.plan(file);
 const manifest=[...plan.images,...plan.scenes].map(e=>({name:e.filename,size:e.size,crc:e.crc,kind:e.kind}));
 const created=await request('/api/reference-library',{action:'begin_bundle',name:plan.name,manifest,revision:state.revision});
 const target=created.id;state.revision=created.revision;
 for(const entry of [...plan.images,...plan.scenes]){
  $('progressText').textContent=plan.name+'：'+entry.filename;
  const data=await ReferenceBundles.read(plan,entry),args={list_id:target,revision:state.revision,name:entry.filename};
  if(entry.kind==='scene')args.task=plan.name;
  const route=entry.kind==='image'?'/api/reference-upload':'/api/reference-scene';
  const response=await fetch(route+'?'+query(args),{method:'POST',headers:headers({'Content-Type':'application/octet-stream'}),body:data,credentials:'omit'});
  const result=await response.json();if(!response.ok)throw Error(result.message||'导入中断，请刷新后重新选择同一ZIP继续。');
  state.revision=result.revision;if(entry.kind==='image')$('progress').value=++uploadProgress.value;
 }
 const result=await request('/api/reference-library',{action:'complete_bundle',id:target,revision:state.revision});state.revision=result.revision;
 return {id:target,name:plan.name,images:plan.images.length,scenes:plan.scenes.length};
}
const uploadProgress={value:0};
$('bundle').onchange=async()=>{
 const files=Array.from($('bundle').files||[]);$('bundle').value='';
 if(!files.length)return;
 const total=files.reduce((n,f)=>n+f.size,0);if(files.length>50||total>ReferenceBundles.LIMITS.batch){notice('每批最多50个ZIP，总大小不超过4 GiB。',true);return;}
 if(!await askConfirm('将导入 '+files.length+' 个任务包（共 '+(total/1048576).toFixed(0)+' MB），每个包建立一个列表。\n\n请保持此页面打开直到完成。'))return;
 busy(true);$('uploadProgress').hidden=false;uploadProgress.value=0;
 let imported=[],last=null;
 try{
  /* Count every image up front so one progress bar covers all bundles. */
  let planned=0;
  const buffers=[];
  for(const file of files){
   const plan=await ReferenceBundles.plan(file);
   buffers.push({file,plan});planned+=plan.images.length;
  }
  $('progress').max=planned;$('progress').value=0;
  for(const {file,plan} of buffers){
   notice('正在导入“'+file.name+'”，请保持页面打开。');
   const result=await importBundle(file,plan);
   imported.push(result);last=result.id;
  }
  await loadCatalog(last||state.selected);
  notice('已导入 '+imported.length+' 个任务包：'+imported.map(r=>r.name+'（'+r.images+' 张）').join('、')+'。请在采集控制页选择要采集的列表。');
 }catch(error){
  try{await loadCatalog(last||state.selected);}catch(ignored){}
  notice(error.message+(imported.length?'（已完成 '+imported.length+' 个包，保留不变）':''),true);
 }finally{$('uploadProgress').hidden=true;busy(false);}
};
$('closeViewer').onclick=()=>{$('viewer').hidden=true;$('large').removeAttribute('src');if(state.viewUrl)URL.revokeObjectURL(state.viewUrl);state.viewUrl=null;};document.addEventListener('keydown',event=>{if(event.key==='Escape')$('closeViewer').click();});
(async function(){const params=new URLSearchParams(location.hash.slice(1));const fromLink=params.get('code');if(fromLink){state.code=fromLink.trim().toUpperCase();history.replaceState(null,'',location.pathname);}else{state.code=sessionStorage.getItem('pi-collect-reference-key')||'';}$('code').value=state.code;if(state.code){sessionStorage.setItem('pi-collect-reference-key',state.code);busy(true);try{await loadCatalog();notice('已连接图库。');}catch(error){notice(error.message,true);}finally{busy(false);}}})();
</script></body></html>
