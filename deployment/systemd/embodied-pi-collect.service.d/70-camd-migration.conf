[Unit]
# EgoRecord v0.1.10 replaced seeker_cam_bridge with camd and removed
# seeker_imu.service. Keeping them in Wants= restarted the ROS bridge, which
# holds /tmp/aiq*.lock and made camd hang in flock() with no socket, so the
# collector saw every headband camera as BrokenPipeError.
Wants=
After=
Wants=network-online.target bluetooth.service camd.service
